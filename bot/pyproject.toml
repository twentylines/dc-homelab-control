[project]
name = "homelab-control-bot"
version = "0.5.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
