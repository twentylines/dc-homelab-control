name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot/requirements.txt ruff==0.17.0 pip-audit==2.10.1
      - name: Validate release and compatibility
        run: |
          set -euo pipefail
          python scripts/validate-release.py "${GITHUB_REF_NAME#v}"
          python scripts/validate-runtipi-app.py
          ruff check bot/homelab_bot bot/tests bot/legacy_healthcheck.py
          python -m unittest discover -s bot/tests -v
          python -m unittest discover -s agent -p 'test_*.py' -v
          python -m unittest discover -s maintenance -p 'test_*.py' -v
          pip-audit -r bot/requirements.txt
          cp config.example.env config.env
          docker compose --env-file config.env -f compose.local.yml config --quiet

  container-images:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Derive image version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build bot and check the installed runtime
        run: |
          docker build -t homelab-control-bot:smoke bot
          docker run --rm --entrypoint python homelab-control-bot:smoke -c 'from homelab_bot.main import HomelabBot; import discord; print(discord.__version__)'
      - name: Publish agent
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dc-homelab-control-agent:${{ steps.version.outputs.version }}
      - name: Publish bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dc-homelab-control-bot:${{ steps.version.outputs.version }}

  source-release:
    needs: [validate-release, container-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package the OTA archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="homelab-control-${version}.tar.gz"
          git archive --format=tar.gz --prefix="homelab-control-${version}/" "$GITHUB_REF_NAME" > "$archive"
          sha256sum "$archive" > SHA256SUMS
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Publish the OTA release after images succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "${GITHUB_REF_NAME#v}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "homelab-control-${GITHUB_REF_NAME#v}.tar.gz" SHA256SUMS "${flags[@]}" \
            --verify-tag --title "Homelab Control ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
