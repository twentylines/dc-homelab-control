name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install runtime and review tools
        run: pip install -r bot/requirements.txt ruff==0.17.0 pip-audit==2.10.1
      - name: Check Python and release contracts
        run: |
          set -euo pipefail
          ruff check bot/homelab_bot bot/tests bot/legacy_healthcheck.py
          python -m unittest discover -s bot/tests -v
          python -m unittest discover -s agent -p 'test_*.py' -v
          python -m unittest discover -s maintenance -p 'test_*.py' -v
          python scripts/validate-release.py
          python scripts/validate-runtipi-app.py
          pip-audit -r bot/requirements.txt
          sh -n scripts/install-compose.sh install-staged-app.sh
          git diff --check
      - name: Validate Compose definitions
        run: |
          cp config.example.env config.env
          docker compose --env-file config.env -f compose.local.yml config --quiet
          CONTROL_TOKEN=test-controller-token-00000000000000000000 \
          DISCORD_TOKEN=test-token DISCORD_CLIENT_ID=123456789012345678 \
          DISCORD_GUILD_ID=123456789012345678 DISCORD_OWNER_ID=123456789012345678 \
          APP_DATA_DIR=/tmp/homelab-control-data \
          docker compose -f app/docker-compose.yml config --quiet
      - name: Build and smoke test the Python bot image
        run: |
          docker build -t homelab-control-bot:test bot
          docker run --rm --entrypoint python homelab-control-bot:test -c 'from homelab_bot.main import HomelabBot; import discord; print(discord.__version__)'
          docker build -t homelab-control-agent:test agent
